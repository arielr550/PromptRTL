name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Unit and static security tests
        run: npm test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests with the packaged extension
        run: npm run test:e2e

      - name: Package extension
        run: npm run package

      - uses: actions/upload-artifact@v4
        with:
          name: promptrtl-extension
          path: dist/promptrtl-*.zip
          if-no-files-found: error
