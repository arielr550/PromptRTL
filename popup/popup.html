<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PromptRTL</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header>
        <img class="mark" src="../assets/icons/icon48.png" alt="" />
        <div>
          <h1>PromptRTL</h1>
          <p>כיוון טקסט אוטומטי בעברית ובאנגלית</p>
        </div>
      </header>

      <label class="setting">
        <span>
          <strong>התוסף פעיל</strong>
          <small>זיהוי אוטומטי של כיוון הטקסט</small>
        </span>
        <input id="enabled" type="checkbox" disabled />
      </label>

      <label class="setting site-setting disabled">
        <span>
          <strong>פעיל באתר זה</strong>
          <small id="hostname" dir="ltr"></small>
        </span>
        <input id="site-enabled" type="checkbox" disabled />
      </label>

      <p class="hint">כיוון התיבה נקבע לפי האות הראשונה. אחרי התקנה או שינוי בקבצים, יש לרענן את הלשונית.</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
