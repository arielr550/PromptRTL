<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PromptRTL</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header>
        <img class="mark" src="../assets/icons/icon48.png" alt="" />
        <div>
          <h1>PromptRTL</h1>
          <p data-i18n="popupTagline"></p>
        </div>
      </header>

      <label class="setting">
        <span>
          <strong data-i18n="enabledLabel"></strong>
          <small data-i18n="enabledDetail"></small>
        </span>
        <input id="enabled" type="checkbox" disabled />
      </label>

      <label class="setting site-setting disabled">
        <span>
          <strong data-i18n="siteLabel"></strong>
          <small id="hostname"></small>
        </span>
        <input id="site-enabled" type="checkbox" disabled />
      </label>

      <p class="hint" data-i18n="hint"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
