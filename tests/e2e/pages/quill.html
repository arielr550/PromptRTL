<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Quill composer (Gemini style)</title>
    <link rel="stylesheet" href="/node_modules/quill/dist/quill.snow.css" />
    <style>
      body { font: 16px sans-serif; }
      rich-textarea { display: block; width: 420px; border: 1px solid #999; }
      .ql-editor { min-height: 80px; }
    </style>
    <script src="log.js"></script>
    <script src="/node_modules/quill/dist/quill.js"></script>
  </head>
  <body>
    <rich-textarea><div id="composer"></div></rich-textarea>

    <script>
      const quill = new Quill("#composer", {
        placeholder: "Enter a prompt here",
        modules: { toolbar: false }
      });
      quill.root.setAttribute("role", "textbox");
      quill.root.setAttribute("aria-multiline", "true");

      window.editor = {
        text: () => quill.getText().replace(/\n$/, ""),
        clear: () => quill.setText(""),
        appendText: (text) => quill.insertText(quill.getLength() - 1, text)
      };
      window.ready = true;
    </script>
  </body>
</html>
